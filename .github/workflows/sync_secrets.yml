name: Sync Secrets to App

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  embed-secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Generate Embedded Key from GitHub Secrets
      env:
        SECRET_GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: |
        python3 -c "
        import os, base64

        key = os.environ.get('SECRET_GEMINI_KEY', '').strip()
        if key:
            encoded = base64.b64encode(key.encode('utf-8')).decode('utf-8')
            content = f'''# Auto-generated by GitHub Actions from Repository Secrets
import base64

_ENCODED_KEY = \"{encoded}\"

def get_embedded_gemini_key() -> str:
    if not _ENCODED_KEY:
        return \"\"
    try:
        return base64.b64decode(_ENCODED_KEY.encode('utf-8')).decode('utf-8')
    except Exception:
        return \"\"
'''
            with open('src/embedded_key.py', 'w', encoding='utf-8') as f:
                f.write(content)
            print('Successfully generated embedded_key.py')
        else:
            print('No GEMINI_API_KEY found in GitHub Secrets')
        "

    - name: Commit and Push if updated
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add src/embedded_key.py
        if git diff --staged --quiet; then
          echo "No changes to commit"
        else
          git commit -m "chore: sync embedded API key from GitHub Secrets [skip ci]"
          git push origin main
        fi
